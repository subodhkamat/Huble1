[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "your-email@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authlib>=1.8.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langgraph>=1.2.15",
    "openai>=3.26.1",
    "playwright>=1.63.0",
    "pwdlib>=0.3.1",
    "pydantic>=2.14.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
